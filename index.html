.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--surface);z-index:9;padding:24px 22px;box-shadow:-8px 0 30px rgba(0,0,0,.25);overflow-y:auto}
