.sentence input.sz{width:5.2em;font:700 inherit;background:var(--hero-card);color:var(--hero-ink);border:0;border-bottom:3px solid var(--accent);border-radius:6px 6px 0 0;padding:2px 8px;margin:0 4px;text-align:center}

.drawer .x{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}

</footer>

function coName(){return (S.company||"").trim()}
var FNO=[["ai","AI and data"],["product","product engineering"],["er","engineering R&D"],["bfsi","finance operations"],["ops","back office work"]];
var PREFO=[["bal","a balance of everything"],["cost","low cost"],["talent","deep talent"],["stable","keeping people"]];
var PLACES=[{id:"blr",name:"Bengaluru"},{id:"hyd",name:"Hyderabad"},{id:"pune",name:"Pune"},{id:"chn",name:"Chennai"},{id:"ahd",name:"Ahmedabad and GIFT City"},{id:"mum",name:"Mumbai (limited data)"},{id:"ncr",name:"Delhi NCR (limited data)"}];
var WHO=["Corporate lawyer","Corporate lawyer","Corporate lawyer","Tax and compliance adviser","Tax and compliance adviser","Tax and compliance adviser","Tax and compliance adviser","Tax and compliance adviser","Corporate lawyer","Tax and compliance adviser"];
var TYPES=[["Corporate lawyer","Structure, incorporation and contracts."],["Tax and compliance adviser","GST, payroll registrations and filings."],["Real estate adviser","Office search, leases and site visits."],["Recruiting and payroll (Flexiple)","Hiring, payroll and compliance support."],["One-off freelance specialist","A single expert for a short task."]];
var NAVI=[["cities","Cities"],["cost","Cost"],["approvals","Approvals"],["sources","Source check"],["experts","Specialists"]];

function $(id){return document.getElementById(id)}
function clamp(x){return Math.max(0,Math.min(100,x))}
function mid(a){return (a[0]+a[1])/2}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function scoreOf(c){
  var w=W[S.pref]||W.bal;
  var cost=clamp(100-(mid(c.cost)-65)/35*100),stable=clamp(100-(mid(c.attr)-11)/7*100);
  var base=(w.cost*cost+w.talent*c.depth+w.stable*stable+w.policy*c.policy)/100;
  var fit=c.strong.indexOf(S.fn)>=0,flags=[],pen=0;
  if(S.size>=200&&c.depth<50){pen=15;flags.push("A team this large may be hard to hire here.");}
  if(!fit)flags.push("Not a standout for "+FN[S.fn]+" in our sources.");
  return {total:Math.round(clamp(base+(fit?10:0)-pen)),fit:fit,flags:flags};
}
function ranking(){return CITIES.map(function(c){return {c:c,s:scoreOf(c)}}).sort(function(a,b){return b.s.total-a.s.total})}
function cost(c){return [Math.round(S.size*14*c.cost[0]/1000)/10, Math.round(S.size*22*c.cost[1]/1000)/10]}
function sel(id,opts,cur){return '<select id="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'}
function placeSel(id){return '<select id="'+id+'"><option value="">All places</option>'+PLACES.map(function(p){return '<option value="'+p.id+'"'+(S.expertPlace===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select>'}
function go(v){S.view=v;S.expertSent=false;render();window.scrollTo(0,0)}

function renderNav(){
  var n=$("nav");
  n.innerHTML=NAVI.map(function(x){return '<button type="button" data-v="'+x[0]+'"'+(S.view===x[0]?' aria-current="page"':'')+'>'+x[1]+'</button>'}).join('');
  Array.prototype.forEach.call(n.querySelectorAll('button'),function(b){b.onclick=function(){go(b.getAttribute('data-v'))}});
  $("logo").onclick=function(){go('home')};
  var label=coName()||'Your company';
  $("coBtn").textContent=label.length>22?label.slice(0,20)+'...':label;
}

function renderHome(){
  var rank=ranking(), top3=rank.slice(0,3);
  var html='<section class="hero"><div class="in">';
  html+='<h1>Set up in India with fewer unknowns.</h1>';
  html+='<p class="sub">Compare cities, see the approvals you need, and check where sources disagree. Every number shows its source.</p>';
  html+='<p class="sentence">A centre for '+sel('fn',FNO,S.fn)+' with <input class="sz" id="sz" type="number" min="20" max="500" value="'+S.size+'"> people, where '+sel('pref',PREFO,S.pref)+' matters most.</p>';
  html+='<div class="picks">';
  top3.forEach(function(item,i){
    var c=item.c,s=item.s;
    html+='<div class="pick"><div class="rk">'+(i===0?'Best match':'Number '+(i+1))+'</div>';
    html+='<h3>'+esc(c.name)+'</h3><p class="st">'+esc(c.state)+(s.fit?' · strong fit':'')+'</p>';
    html+='<div class="meter"><i style="width:'+s.total+'%"></i></div>';
    html+='<div class="sc"><span>Match</span><b>'+s.total+'</b></div>';
    html+='<button type="button" data-go="cities">See why</button></div>';
  });
  html+='</div></div></section>';
  var cr=cost(top3[0].c);
  html+='<div class="band"><div class="tiles">';
  html+='<button class="tile" type="button" data-go="approvals"><h3>Approvals roadmap</h3><p>The registrations and filings in order, with who you need for each.</p><div class="prev"><b>10 steps</b>From structure to employer registrations.<div class="dots"><i></i><u></u><i></i><u></u><i></i><u></u><i></i><u></u><i></i></div></div></button>';
  html+='<button class="tile" type="button" data-go="cost"><h3>Cost estimator</h3><p>A yearly talent cost range for your team, city by city.</p><div class="prev"><b>Rs '+cr[0]+' to '+cr[1]+' crore</b>per year for '+S.size+' people in '+esc(top3[0].c.name)+'</div></button>';
  html+='</div></div>';
  $("view").innerHTML=html;
  $("fn").onchange=function(){S.fn=this.value;render()};
  $("pref").onchange=function(){S.pref=this.value;render()};
  $("sz").onchange=function(){S.size=Math.max(20,Math.min(500,parseInt(this.value,10)||100));render()};
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(b){b.onclick=function(){go(b.getAttribute('data-go'))}});
}

function renderCities(){
  var rank=ranking();
  var html='<div class="page"><h1>Cities</h1><p class="lead">Ranked for a '+S.size+'-person centre doing '+esc(FN[S.fn])+'. Scores are prototype estimates from public sources.</p>';
  html+='<div class="ctrl"><div><label>Function</label>'+sel('fn2',FNO,S.fn)+'</div><div><label>Team size</label><input type="number" id="sz2" min="20" max="500" value="'+S.size+'"></div><div><label>Priority</label>'+sel('pref2',PREFO,S.pref)+'</div></div>';
  rank.forEach(function(item,i){
    var c=item.c,s=item.s;
    html+='<div class="city'+(i===0?' first':'')+'"><div class="hd"><h3>'+esc(c.name)+' <small>'+esc(c.state)+'</small></h3><div class="big">'+s.total+' <span>match</span></div></div>';
    html+='<div class="sbar"><i style="width:'+s.total+'%"></i></div>';
    html+='<div class="kv"><span>Talent depth <b>'+c.depth+'</b></span><span>Relative cost index <b>'+mid(c.cost)+'</b></span><span>Attrition ~<b>'+mid(c.attr)+'%</b></span><span>Policy signal <b>'+c.policy+'</b></span></div>';
    if(s.flags.length) s.flags.forEach(function(f){html+='<span class="flag">'+esc(f)+'</span>'});
    html+='<details><summary>Facts and sources</summary><ul>';
    c.facts.forEach(function(f){html+='<li>'+esc(f[0])+' '+cite(f[1])+'</li>'});
    html+='</ul><p style="margin-top:8px;font-size:.9rem">'+esc(c.policyText)+'</p></details></div>';
  });
  html+='<h2 style="margin-top:28px;font:700 1.2rem var(--display)">Limited data (not scored)</h2>';
  LIMITED.forEach(function(l){html+='<div class="limited"><b>'+esc(l.name)+'</b> — '+esc(l.text)+' '+cite(l.src)+'</div>'});
  html+='</div>';
  $("view").innerHTML=html;
  $("fn2").onchange=function(){S.fn=this.value;render()};
  $("pref2").onchange=function(){S.pref=this.value;render()};
  $("sz2").onchange=function(){S.size=Math.max(20,Math.min(500,parseInt(this.value,10)||100));render()};
}

function renderCost(){
  var rank=ranking();
  var html='<div class="page"><h1>Cost estimator</h1><p class="lead">Rough yearly talent cost ranges for a '+S.size+'-person team. Order-of-magnitude estimates only.</p>';
  html+='<div class="ctrl"><div><label>Team size</label><input type="number" id="sz3" min="20" max="500" value="'+S.size+'"></div></div>';
  rank.forEach(function(item,i){
    var c=item.c, cr=cost(c);
    html+='<div class="city"><div class="hd"><h3>'+esc(c.name)+'</h3><div class="big">Rs '+cr[0]+' – '+cr[1]+' <span>crore / year</span></div></div>';
    html+='<div class="kv"><span>Relative cost index <b>'+mid(c.cost)+'</b></span><span>Match <b>'+item.s.total+'</b></span></div></div>';
  });
  html+='<p class="note">Assumptions: blended cost scaled from public salary signals. Does not include office rent or setup costs. Sources: '+cite(['S8','S9','S10','S11'])+'</p></div>';
  $("view").innerHTML=html;
  $("sz3").onchange=function(){S.size=Math.max(20,Math.min(500,parseInt(this.value,10)||100));render()};
}

function renderApprovals(){
  var html='<div class="page"><h1>Approvals roadmap</h1><p class="lead">A practical sequence of registrations and filings. Guidance, not legal advice.</p>';
  html+='<div class="callout">Start with legal structure and foreign investment route. Later steps depend on the entity you form and when you hire.</div>';
  STEPS.forEach(function(st,i){
    html+='<div class="step"><div class="n">'+(i+1)+'</div><div><h3>'+esc(st[0])+'</h3><p>'+esc(st[1])+' '+cite(st[2])+'</p></div><span class="who">'+esc(WHO[i]||'Adviser')+'</span></div>';
  });
  html+='<h2 style="margin:28px 0 10px;font:700 1.25rem var(--display)">State policy snapshot</h2>';
  STATES.forEach(function(st){html+='<div class="limited"><b>'+esc(st[0])+'</b> — '+esc(st[1])+' '+cite(st[2])+'</div>'});
  html+='</div>';
  $("view").innerHTML=html;
}

function renderSources(){
  var html='<div class="page"><h1>Source check</h1><p class="lead">Where public reports disagree.</p>';
  GAPS.forEach(function(g){
    html+='<div class="gap"><h3>'+esc(g.t)+'</h3><div class="row"><div class="v"><b>Source A</b><br>'+esc(g.a[0])+' '+cite(g.a[1])+'</div><div class="v"><b>Source B</b><br>'+esc(g.b[0])+' '+cite(g.b[1])+'</div></div>';
    html+='<p><b>Takeaway:</b> '+esc(g.take)+'</p></div>';
  });
  html+='</div>';
  $("view").innerHTML=html;
}

function renderExperts(){
  var html='<div class="page"><h1>Specialists</h1><p class="lead">When you need one expert before you hire a full team.</p>';
  if(S.expertSent){
    html+='<div class="confirm"><b>Request noted</b><p style="margin:8px 0 0">We recorded your request for a <b>'+esc(S.expertType||'specialist')+'</b>. In production this would introduce you to a specialist.</p>';
    html+='<p style="margin:12px 0 0"><button class="link" type="button" id="again">Submit another</button></p></div>';
    $("view").innerHTML=html;
    $("again").onclick=function(){S.expertSent=false;render()};
    return;
  }
  html+='<div class="cards">';
  TYPES.forEach(function(t){
    html+='<button class="sp" type="button" data-type="'+esc(t[0])+'"'+(S.expertType===t[0]?' aria-pressed="true"':'')+'><h3>'+esc(t[0])+'</h3><p>'+esc(t[1])+'</p></button>';
  });
  html+='</div>';
  html+='<div class="ctrl" style="flex-direction:column;align-items:stretch">';
  html+='<div><label>Type of help</label><select id="exType"><option value="">Select…</option>'+TYPES.map(function(t){return '<option value="'+esc(t[0])+'"'+(S.expertType===t[0]?' selected':'')+'>'+esc(t[0])+'</option>'}).join('')+'</select></div>';
  html+='<div><label>State / city</label>'+placeSel('exPlace')+'</div>';
  html+='<div><label>Short description</label><textarea id="exNote" rows="3">'+esc(S.expertNote||'')+'</textarea></div>';
  html+='<div><label>Email (optional)</label><input type="email" id="exEmail" value="'+esc(S.expertEmail||'')+'"></div>';
  html+='<div style="margin-top:8px"><button class="go" type="button" id="exGo">Request introduction</button></div></div>';
  html+='<p class="note">Recruiting and payroll at scale: <a href="https://flexiple.com/" target="_blank" rel="noopener">Flexiple</a></p></div>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('.sp'),function(b){b.onclick=function(){S.expertType=b.getAttribute('data-type');render()}});
  $("exGo").onclick=function(){
    S.expertType=$("exType").value||S.expertType;
    S.expertPlace=$("exPlace").value;
    S.expertNote=$("exNote").value;
    S.expertEmail=$("exEmail").value;
    if(!S.expertType){alert('Please select the type of help.');return;}
    S.expertSent=true;render();
  };
}

function render(){
  renderNav();
  if(S.view==='home') renderHome();
  else if(S.view==='cities') renderCities();
  else if(S.view==='cost') renderCost();
  else if(S.view==='approvals') renderApprovals();
  else if(S.view==='sources') renderSources();
  else if(S.view==='experts') renderExperts();
  else renderHome();
  var ol=$("srcList");
  if(ol) ol.innerHTML=Object.keys(SRC).map(function(k){return '<li><a href="'+SRC[k][1]+'" target="_blank" rel="noopener">'+esc(SRC[k][0])+'</a></li>'}).join('');
}

$("themeBtn").onclick=function(){
  var cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':(cur==='light'?'dark':(window.matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark')));
};
$("coBtn").onclick=function(){$("scrim").hidden=false;$("drawer").hidden=false;$("coName").value=S.company;$("coWork").innerHTML=FNO.map(function(o){return '<option value="'+o[0]+'"'+(S.work===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')};
$("drClose").onclick=$("scrim").onclick=function(){
  S.company=$("coName").value;S.work=$("coWork").value;if(S.work)S.fn=S.work;
  $("scrim").hidden=true;$("drawer").hidden=true;render();
};
render();
</script>
</body>
</html>
