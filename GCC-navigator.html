}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

[hidden]{display:none!important}

.band{margin-top:18px}

</style>
</head>

 ["Delhi NCR (Haryana and Delhi)","Haryana is listed with a dedicated policy in one report, and Delhi with a framework. Check the policy that applies to the exact site.",["S4","S5"]]
];
var GAPS=[
 {t:"How many states have a GCC policy?",a:["One report on the CBRE study lists eight states with dedicated policies: Karnataka, Maharashtra, Haryana, Uttar Pradesh, Gujarat, Rajasthan, Madhya Pradesh and Andhra Pradesh, with Kerala's still a draft.",["S4"]],b:["Another report on the same study lists seven formal policies: Karnataka, Maharashtra, Rajasthan, Gujarat, Kerala, Haryana and Madhya Pradesh. A law-firm note covers only four states.",["S5","S6"]],take:"A company reading one source would shortlist different states from one reading another. Check the state's own notified policy."},
 {t:"How much office space did Hyderabad lease in H1 2026?",a:["About 7.2 mn sq ft, up 47% on last year.",["S2"]],b:["About 5.9 mn sq ft, up 9%.",["S1"]],take:"The two firms measure different sets of cities and deals. Use the trend, not the exact number."},
 {t:"Is Hyderabad cheaper than Bengaluru?",a:["Described as the best alternative to Bengaluru, offering the same services at a lower cost.",["S9"]],b:["Senior pay has effectively caught up with Bengaluru because of GCC density.",["S11"]],take:"Likely true at different seniority levels. Ask for role-level quotes before assuming a saving."},
 {t:"How many GCCs does India have?",a:["2,117 GCCs across 3,728 units in FY26 (Nasscom-Zinnov), counting both companies and individual centres.",["S13"]],b:["A paid list holds about 1,400 GCCs; a free directory lists 200+ verified ones.",["S14","S15"]],take:"Lists count different things (parent companies, centres, verified entries). Always ask what is being counted."}
];


SRC.S19=["Flexiple: build your offshore India team","https://flexiple.com/"];

var S={view:"home",fn:"product",size:100,pref:"bal",place:"",focus:"",type:"",company:""};
function coName(){return (S.company||"").trim()}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
var FNO=[["ai","AI and data"],["product","product engineering"],["er","engineering R&D"],["bfsi","finance operations"],["ops","back office work"]];
var PREFO=[["bal","a balance of everything"],["cost","low cost"],["talent","deep talent"],["stable","keeping people"]];
var PLACES=[{id:"blr",name:"Bengaluru",st:0},{id:"hyd",name:"Hyderabad",st:3},{id:"pune",name:"Pune",st:1},{id:"chn",name:"Chennai",st:4},{id:"ahd",name:"Ahmedabad and GIFT City",st:2},{id:"mum",name:"Mumbai (limited data)",st:1},{id:"ncr",name:"Delhi NCR (limited data)",st:5}];
var GAPTAGS=[["all"],["hyd"],["hyd"],["all"]];
var WHO=["Corporate lawyer","Corporate lawyer","Corporate lawyer","Tax and compliance adviser","Tax and compliance adviser","Tax and compliance adviser","Tax and compliance adviser","Tax and compliance adviser","Corporate lawyer","Tax and compliance adviser"];
var TYPES=[["Corporate lawyer","Structure, incorporation and contracts."],["Tax and compliance adviser","GST, payroll registrations and filings."],["Real estate adviser","Office search, leases and site visits."],["Recruiting and payroll (Flexiple)","Hiring, payroll and compliance support."],["One-off freelance specialist","A single expert for a short task."]];
var NAVI=[["cities","Cities"],["cost","Cost"],["approvals","Approvals"],["sources","Source check"],["experts","Specialists"]];

function $(id){return document.getElementById(id)}
function clamp(x){return Math.max(0,Math.min(100,x))}
function mid(a){return (a[0]+a[1])/2}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pById(id){for(var i=0;i<PLACES.length;i++)if(PLACES[i].id===id)return PLACES[i];return null}
function cById(id){for(var i=0;i<CITIES.length;i++)if(CITIES[i].id===id)return CITIES[i];return null}
function scoreOf(c){
  var w=W[S.pref==="bal"?"bal":S.pref];var cost=clamp(100-(mid(c.cost)-65)/35*100),stable=clamp(100-(mid(c.attr)-11)/7*100);
  var base=(w.cost*cost+w.talent*c.depth+w.stable*stable+w.policy*c.policy)/100;
  var fit=c.strong.indexOf(S.fn)>=0,flags=[],pen=0;
  if(S.size>=200&&c.depth<50){pen=15;flags.push("A team this large may be hard to hire here, so it is ranked lower.");}
  if(!fit)flags.push("Not a standout for "+FN[S.fn]+" in our sources.");
  return {total:Math.round(clamp(base+(fit?10:0)-pen)),fit:fit,flags:flags};
}
function ranking(){return CITIES.map(function(c){return {c:c,s:scoreOf(c)}}).sort(function(a,b){return b.s.total-a.s.total})}
function cost(c){return [S.size*14*c.cost[0]/10000,S.size*22*c.cost[1]/10000]}
function sel(id,opts,cur){return '<select id="'+id+'" aria-label="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select>'}
function placeSel(id){return '<select id="'+id+'"><option value="">All places</option>'+PLACES.map(function(p){return '<option value="'+p.id+'"'+(S.place===p.id?" selected":"")+'>'+esc(p.name)+'</option>'}).join("")+'</select>'}
function go(v){S.view=v;render();window.scrollTo(0,0)}

/* ---------- Home ---------- */
function home(){
  var r=ranking(),top=r[0].c;
  var h='<section class="hero"><div class="in"><h1>Set up in India with fewer unknowns.</h1><p class="sub">Compare cities, see the approvals you need, and check where sources disagree. Every number shows its source.</p>'
   +'<p class="sentence">A centre for '+sel("fn",FNO,S.fn)+' with <input id="size" class="sz" type="number" min="1" max="100000" step="1" value="'+S.size+'" inputmode="numeric" aria-label="Number of people"> people, where '+sel("pref",PREFO,S.pref)+' matters most.</p>'
   +'<div class="picks" id="picks"></div></div></section>';
  h+='<div class="band"><p class="more">Based on public sources gathered in October 2026. Scores are estimates, not official ratings.</p></div>';
  return h;
}
function drawPicks(){
  var r=ranking().slice(0,3);
  $("picks").innerHTML=r.map(function(x,i){var c=x.c;return '<div class="pick"><span class="rk">'+(i===0?"Best match"+(coName()?" for "+esc(coName()):""):"Number "+(i+1))+'</span><h3>'+esc(c.name)+'</h3><p class="st">'+esc(c.state)+(x.s.fit?" · strong fit":"")+'</p><div class="meter" aria-hidden="true"><i style="width:'+x.s.total+'%"></i></div><div class="sc"><span>Match</span><b>'+x.s.total+'</b></div><button type="button" data-focus="'+c.id+'">See why</button></div>'}).join("");
  var t=r[0].c,k=cost(t);
  if($("pvCost")){$("pvCost").textContent="Rs "+k[0].toFixed(0)+" to "+k[1].toFixed(0)+" crore";$("pvCostS").textContent="per year for "+S.size+" people in "+t.name}
  document.querySelectorAll("[data-focus]").forEach(function(b){b.addEventListener("click",function(){S.focus=b.dataset.focus;go("cities")})});
}

/* ---------- Cities ---------- */
function cities(){
  var h='<div class="page"><h1>Compare cities</h1><p class="lead">Ranked on cost, talent depth, retention and state policy.</p>'
   +'<div class="ctrl"><div><label for="fn">Centre does</label>'+sel("fn",FNO,S.fn)+'</div><div><label for="size">People in year one</label><input id="size" type="number" min="1" max="100000" step="1" value="'+S.size+'" inputmode="numeric"></div><div><label for="pref">Matters most</label>'+sel("pref",PREFO,S.pref)+'</div></div><div id="cl"></div>';
  h+='<h2 style="font:700 1.2rem var(--display);margin:28px 0 8px">Not ranked: not enough reliable data</h2>'+LIMITED.map(function(l){return '<div class="limited"><b>'+esc(l.name)+'</b><br>'+esc(l.text)+cite(l.src)+'</div>'}).join("")+'</div>';
  return h;
}
function drawCities(){
  var r=ranking();
  $("cl").innerHTML=r.map(function(x,i){var c=x.c,L=(c.cost[0]-60)/45*100;
    return '<article class="city'+(i===0?" first":"")+'" id="c-'+c.id+'"><div class="hd"><h3>'+(i+1)+'. '+esc(c.name)+'<small>'+esc(c.state)+'</small></h3><div class="big">'+x.s.total+'<span> match</span></div></div><div class="sbar" aria-hidden="true"><i style="width:'+x.s.total+'%"></i></div>'
    +'<div class="kv"><span>Cost <b>'+(c.cost[0]===c.cost[1]?"100":c.cost[0]+" to "+c.cost[1])+'</b> (Bengaluru = 100)</span><span>Attrition <b>'+c.attr[0]+'-'+c.attr[1]+'%</b></span><span>Talent depth <b>'+c.depth+'</b></span></div>'
    +'<div class="kv" style="margin-top:6px"><span>Policy: <b>'+esc(c.policyText)+'</b></span></div>'
    +x.s.flags.map(function(f){return '<span class="flag">'+esc(f)+'</span>'}).join("")
    +'<details'+(S.focus===c.id?" open":"")+'><summary>Why, with sources</summary><ul>'+c.facts.map(function(f){return '<li>'+esc(f[0])+cite(f[1])+'</li>'}).join("")+'</ul></details></article>';
  }).join("");
  if(S.focus){var e=$("c-"+S.focus);if(e&&e.scrollIntoView)e.scrollIntoView({block:"center"});S.focus="";}
}

/* ---------- Cost ---------- */
function costPage(){
  var h='<div class="page"><h1>Cost estimator</h1><p class="lead">Rough yearly talent cost for mid-level software roles. Office, setup and tax costs are not included: we found no reliable city-wise figures.</p>'
   +'<div class="ctrl"><div><label for="size">People in year one</label><input id="size" type="number" min="1" max="100000" step="1" value="'+S.size+'" inputmode="numeric"></div></div><div id="cb"></div>'
   +'<p class="note">A Bengaluru GCC mid-level engineer (3 to 5 years) is quoted at Rs 14 to 22 lakh a year'+cite(["S10"])+'. Other cities scale by the cost range from our sources'+cite(["S8","S9"])+'.</p></div>';
  return h;
}
function drawCost(){
  var r=ranking(),cheapest=CITIES.slice().sort(function(a,b){return mid(a.cost)-mid(b.cost)})[0],kc=cost(cheapest),kb=cost(cById("blr"));
  var max=cost(cById("blr"))[1];
  var h='<div class="bignum"><b>Rs '+kc[0].toFixed(1)+' to '+kc[1].toFixed(1)+' crore a year</b><span>in '+esc(cheapest.name)+', the lowest-cost city we found, for '+S.size+' people. Bengaluru: Rs '+kb[0].toFixed(1)+' to '+kb[1].toFixed(1)+' crore.</span></div>';
  h+=r.map(function(x){var k=cost(x.c);var L=k[0]/max*100,Wd=Math.max(3,(k[1]-k[0])/max*100);return '<div class="rowb"><span><b>'+esc(x.c.name)+'</b></span><div class="track" aria-hidden="true"><i style="left:'+L.toFixed(1)+'%;width:'+Wd.toFixed(1)+'%"></i></div><span>Rs '+k[0].toFixed(1)+' to '+k[1].toFixed(1)+' crore</span></div>'}).join("");
  $("cb").innerHTML=h;
}

/* ---------- Approvals ---------- */
function approvals(){
  var h='<div class="page"><h1>Approvals roadmap</h1><p class="lead">A typical route for a wholly owned subsidiary of a foreign company.</p><div class="ctrl"><div><label for="pl">Place</label>'+placeSel("pl")+'</div></div><div id="pol"></div><div id="stp"></div>'
   +'<p class="note"><b>Not yet verified:</b> timelines, fees and form numbers. Confirm each step on the official portal and with a licensed professional.</p></div>';
  return h;
}
function drawApprovals(){
  var p=S.place?pById(S.place):null;
  $("pol").innerHTML='<div class="callout">'+(p?'<b>'+esc(STATES[p.st][0])+'</b><br>'+esc(STATES[p.st][1])+cite(STATES[p.st][2]):'Choose a place to see its state GCC policy. The steps below apply in general.')+'</div>';
  $("stp").innerHTML=STEPS.map(function(s,i){return '<div class="step"><div class="n">'+(i+1)+'</div><div><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+cite(s[2])+'</p></div><div><span class="who">'+WHO[i]+'</span><br><button class="link" type="button" data-help="'+WHO[i]+'" style="font-size:.84rem;margin-top:6px">Get help</button></div></div>'}).join("");
  document.querySelectorAll("[data-help]").forEach(function(b){b.addEventListener("click",function(){S.type=b.dataset.help;go("experts")})});
}

/* ---------- Source check ---------- */
function sources(){
  return '<div class="page"><h1>Source check</h1><p class="lead">Places where published sources disagree. Choose a place to see only what applies.</p><div class="ctrl"><div><label for="pl">Place</label>'+placeSel("pl")+'</div></div><div id="go"></div></div>';
}
function drawSources(){
  var sh=GAPS.filter(function(g,i){return !S.place||GAPTAGS[i].indexOf("all")>=0||GAPTAGS[i].indexOf(S.place)>=0});
  $("go").innerHTML='<p style="color:var(--ink2)">Showing '+sh.length+' of '+GAPS.length+'.</p>'+sh.map(function(g){return '<div class="gap"><h3>'+esc(g.t)+'</h3><div class="row"><div class="v">'+esc(g.a[0])+cite(g.a[1])+'</div><div class="v">'+esc(g.b[0])+cite(g.b[1])+'</div></div><p><b>What to do:</b> '+esc(g.take)+'</p></div>'}).join("");
}

/* ---------- Specialists ---------- */
function experts(){
  var h='<div class="page"><h1>Specialists</h1><p class="lead">Pick the kind of help you need and tell us briefly. This prototype shows the flow; nothing is sent.</p><div class="cards">'
   +TYPES.map(function(t){return '<button class="sp" type="button" data-type="'+esc(t[0])+'" aria-pressed="'+(S.type===t[0])+'"><h3>'+esc(t[0])+'</h3><p>'+esc(t[1])+'</p></button>'}).join("")+'</div>'
   +'<div class="ctrl" id="xf"><div><label for="x2">City or state</label><input id="x2" type="text" value="'+esc(S.place?pById(S.place).name.replace(" (limited data)",""):"")+'"></div><div><label for="x4">Work email</label><input id="x4" type="email" placeholder="name@company.com"></div><div style="flex-basis:100%"><label for="x3">What do you need?</label><textarea id="x3" rows="2"></textarea></div><div><button class="go" id="xb" type="button">Request an introduction</button></div></div><div id="xo" role="status"></div>'
   +'<p class="note"><b>How this earns:</b> exploring is free. An introduction carries a fixed fee for the session plus a small platform fee. Hiring or entity setup through Flexiple is a separate service.</p></div>';
  return h;
}

/* ---------- Render ---------- */
function render(){
  $("nav").innerHTML=NAVI.map(function(n){return '<button type="button" data-go="'+n[0]+'"'+(S.view===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>'}).join("");
  var v=S.view,m=$("view");
  m.innerHTML=({home:home,cities:cities,cost:costPage,approvals:approvals,sources:sources,experts:experts}[v])();
  document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.go)})});
  var sz=$("size");
  if(sz)sz.addEventListener("input",function(){var n=Math.floor(+sz.value);if(sz.value!==""&&n>=1&&n<=100000){S.size=n;refresh();}});
  var fnE=$("fn");if(fnE)fnE.addEventListener("input",function(){S.fn=fnE.value;$("coWork").value=S.fn;updateChip();refresh();});
  var pf=$("pref");if(pf)pf.addEventListener("input",function(){S.pref=pf.value;refresh();});
  if(v==="home")drawPicks();
  if(v==="cities")drawCities();
  if(v==="cost")drawCost();
  if(v==="approvals"){drawApprovals();$("pl").addEventListener("change",function(){S.place=$("pl").value;drawApprovals();});}
  if(v==="sources"){drawSources();$("pl").addEventListener("change",function(){S.place=$("pl").value;drawSources();});}
  if(v==="experts"){
    document.querySelectorAll("[data-type]").forEach(function(b){b.addEventListener("click",function(){S.type=b.dataset.type;document.querySelectorAll("[data-type]").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});});});
    $("xb").addEventListener("click",function(){
      var o=$("xo"),em=$("x4").value.trim();
      if(!S.type){o.className="ok";o.textContent="Pick the kind of help you need first.";return;}
      if(!/^\S+@\S+\.\S+$/.test(em)){o.className="ok";o.textContent="Enter a valid work email so a specialist can reply.";return;}
      o.className="ok";o.textContent="Request drafted for a "+S.type+". In the full product it goes to a vetted specialist and you hear back at "+em+". Nothing was sent from this prototype.";
    });
  }
}
function refresh(){if(S.view==="home")drawPicks();if(S.view==="cities")drawCities();if(S.view==="cost")drawCost();}
function workLabel(){for(var i=0;i<FNO.length;i++)if(FNO[i][0]===S.fn)return cap(FNO[i][1]);return ""}
function updateChip(){var n=coName().slice(0,26);$("coBtn").textContent=n?n+" · "+workLabel():"Your company"}
function openDrawer(){$("scrim").hidden=false;$("drawer").hidden=false;$("coName").focus();}
function closeDrawer(){$("scrim").hidden=true;$("drawer").hidden=true;$("coBtn").focus();}
$("coWork").innerHTML=FNO.map(function(o){return '<option value="'+o[0]+'">'+cap(o[1])+'</option>'}).join("");
$("coWork").value=S.fn;
$("coName").addEventListener("input",function(){S.company=$("coName").value;updateChip();if(S.view==="home")drawPicks();});
$("coWork").addEventListener("change",function(){S.fn=$("coWork").value;updateChip();render();});
$("coBtn").addEventListener("click",openDrawer);$("drClose").addEventListener("click",closeDrawer);$("scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("drawer").hidden)closeDrawer();});
updateChip();
$("logo").addEventListener("click",function(){go("home")});
$("themeBtn").addEventListener("click",function(){var r=document.documentElement;var dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",dark?"light":"dark");});
$("srcList").innerHTML=Object.keys(SRC).map(function(k){return '<li value="'+k.slice(1)+'"><a href="'+SRC[k][1]+'" target="_blank" rel="noopener">'+esc(SRC[k][0])+'</a></li>'}).join("");
render();
</script>
